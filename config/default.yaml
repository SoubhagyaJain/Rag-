# Default configuration for RAG over "AI Agents: The Illustrated Guidebook (2025 Edition)"
# All values here are production-sensible defaults. Override via env or experiment scripts.

paths:
  pdf: data/raw/ai_agents_guidebook.pdf
  vectorstore_dir: data/vectorstore
  golden_dataset: data/evaluation/golden_dataset.json
  artifacts_dir: artifacts

chunking:
  # Target size in tokens (approximate). Structure-aware chunker will respect boundaries.
  max_tokens: 450
  overlap_tokens: 60

  # Respect document structure (highly recommended for this illustrated book)
  preserve_sections: true
  table_as_single_chunk: true
  code_as_single_chunk: true
  list_as_single_chunk: false   # allow splitting long lists if needed

  # Heuristics for heading detection (pdfplumber font-size based)
  heading_font_size_threshold: 1.25   # times average font size on page

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  # device: "cpu" or "cuda" (auto-detected if not set)
  normalize_embeddings: true
  batch_size: 32

vectorstore:
  collection_name: ai_agents_guidebook_v1
  distance: cosine   # or l2, ip

retrieval:
  # Core knobs for easy experimentation
  top_k: 8
  hybrid:
    enabled: true
    alpha: 0.65          # 0.0 = pure BM25, 1.0 = pure vector
    rrf_k: 60            # Reciprocal Rank Fusion constant

  reranker:
    enabled: true
    model_name: cross-encoder/ms-marco-MiniLM-L-6-v2   # good default for relevance
    top_k_before_rerank: 25

  parent_child:
    enabled: true
    # When enabled, we retrieve fine-grained children but expand context with parent section text
    parent_expansion: 1   # number of neighboring chunks from same section to include

llm:
  # Used for answer synthesis (in query) and LLM-as-judge (in evaluation)
  provider: ollama          # ollama | openai | none
  model: gemma2:9b
  base_url: http://localhost:11434
  temperature: 0.1
  max_tokens: 1200
  timeout: 120

evaluation:
  # Metrics always computed (no LLM required)
  metrics:
    - retrieval_recall_at_k
    - retrieval_precision_at_k
    - context_relevance_proxy   # term overlap with must_retrieve_terms + page overlap
    - answer_similarity         # cosine of embeddings between generated answer and ground_truth

  # Optional but powerful
  use_llm_as_judge: true
  judge_metrics:
    - faithfulness
    - answer_relevancy
    - correctness

  k_values: [3, 5, 8, 10, 15]

observability:
  log_level: INFO
  trace_dir: artifacts/traces
  save_retrieval_details: true
  save_llm_prompts: false     # set true for deep debugging (tokens + cost)
